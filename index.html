<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PII 2026 – TP. Hà Nội</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
:root{--bg:#fff;--sf:#fff;--sf2:#f6f7f9;--bd:#e2e5ec;--tx:#222;--tx2:#555;--tx3:#aaa;--acc:#1a6cc4}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,Helvetica,sans-serif;font-size:18px;background:var(--bg);color:var(--tx);-webkit-text-size-adjust:100%}
.wrap{max-width:1000px;margin:0 auto;padding:14px 12px 40px}
header{text-align:left;margin-bottom:12px}
header h1{font-size:22px;font-weight:700}
header .sub{color:var(--tx2);font-size:18px;margin-top:8px}
.cleg{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:18px;color:var(--tx2)}
.cbar{width:90px;height:6px;border-radius:3px;background:linear-gradient(90deg,#34d399,#fbbf24,#f97316)}
.nav{display:none;align-items:center;gap:10px;width:fit-content;max-width:100%;flex-wrap:wrap;margin-bottom:10px;padding:4px 12px;border:1px solid var(--acc);border-radius:6px;background:#fff}
.bbtn{display:none;align-items:center;gap:3px;padding:0 10px 0 0;margin-right:2px;border:none;border-right:1px solid var(--bd);border-radius:0;font-size:18px;font-weight:600;cursor:pointer;background:transparent;color:var(--acc);font-family:Arial,Helvetica,sans-serif}
.bbtn:hover{text-decoration:underline}
.bbtn.show{display:inline-flex}
.bc{display:flex;align-items:center;gap:4px;font-size:18px;flex-wrap:wrap}
.bc a{color:var(--acc);text-decoration:none;cursor:pointer;font-weight:600}
.bc a:hover{text-decoration:underline}
.bc .sep{color:var(--tx3)}
.bc .cur{color:var(--tx);font-weight:700}
.guide{font-size:18px;color:var(--tx3);margin-top:0;margin-bottom:4px;font-style:italic}
.card{max-width:1000px;border:1px solid var(--bd);border-radius:8px;padding:10px 4px 6px 0;overflow-x:auto;background:#fff}
svg text{font-family:Arial,Helvetica,sans-serif}
.tt{position:fixed;pointer-events:none;background:#fff;border:1px solid #dde;border-radius:7px;padding:8px 12px;box-shadow:0 3px 12px rgba(0,0,0,.1);font-size:18px;z-index:100;opacity:0;transition:opacity .1s;max-width:320px;color:#222;font-family:Arial,Helvetica,sans-serif}
.tt.show{opacity:1}
.tt .tn{font-weight:700;margin-bottom:3px;line-height:1.3}
.tt .tr{display:flex;justify-content:space-between;gap:12px}
.tt .tl{color:#888}
.tt .tv{font-weight:700}
@media(max-width:600px){
  body{font-size:14px}
  .wrap{padding:8px 4px 24px}
  header{margin-bottom:14px}
  header h1{font-size:18px}
  header .sub{font-size:12px;margin-top:5px}
  .cleg{font-size:12px;gap:5px;margin-top:8px}
  .cbar{width:70px;height:5px}
  .nav{gap:6px;margin-bottom:8px;padding:3px 8px}
  .bbtn{font-size:12px;padding:0 6px 0 0}
  .bc{font-size:12px}
  .guide{font-size:12px;margin-bottom:3px}
  .card{padding:6px 2px 4px 0;border-radius:6px}
  .tt{font-size:13px;padding:6px 8px;max-width:220px}
}
</style>
</head>
<body>

    <div class="cleg"><span>Hạng cao</span><div class="cbar"></div><span>Hạng thấp</span></div>
  </header>
  <div class="nav">
    <button class="bbtn" id="bb" onclick="goBack()">← Quay lại</button>
    <div class="bc" id="bc"></div>
  </div>
  <div class="guide" id="gd">Chọn chấm tròn để xem thêm</div>
  <div class="card"><svg id="ch"></svg></div>
</div>
<div class="tt" id="tt"></div>

const P=[

{id:'7',n:'Tác động',s:50.26,r:9,subs:[

];
const tt=document.getElementById('tt'),bcEl=document.getElementById('bc'),
      bb=document.getElementById('bb'),gd=document.getElementById('gd');
let ns=[];
function goBack(){if(ns.length>0)ns.pop()();}
function setBC(parts){
  bcEl.innerHTML='';
  parts.forEach((p,i)=>{
    if(i>0)bcEl.insertAdjacentHTML('beforeend','<span class="sep">›</span>');
    if(p.fn){const a=document.createElement('a');a.textContent=p.t;a.addEventListener('click',p.fn);bcEl.appendChild(a);}
    else bcEl.insertAdjacentHTML('beforeend',`<span class="cur">${p.t}</span>`);
  });
  bb.className=ns.length>0?'bbtn show':'bbtn';
  document.querySelector('.nav').style.display=(ns.length>0||parts.length>0)?'flex':'none';
}
function mH(text,w,fs){
  let m=document.getElementById('_m');
  if(!m){m=document.createElement('div');m.id='_m';
    m.style.cssText='position:absolute;visibility:hidden;font-family:Arial,Helvetica,sans-serif;line-height:1.3;white-space:pre-line;word-break:break-word;text-align:right;';
    document.body.appendChild(m);}
  m.style.width=w+'px';m.style.fontSize=fs+'px';m.textContent=text;return m.offsetHeight;
}
function draw(items,gl,clickFn,byRank){
  const svg=d3.select('#ch');svg.selectAll('*').remove();tt.classList.remove('show');
  items.sort((a,b)=>a.r-b.r||a.id.localeCompare(b.id,undefined,{numeric:true}));
  const mob=window.innerWidth<550;
  const FS=mob?14:18;
  const AXIS_FS=mob?12:16;
  const labelW=mob?Math.round(window.innerWidth*.38):320;
  const GAP=mob?12:20; // gap between labels and chart area
  const cL=labelW+GAP;
  const cR=mob?14:28;
  const totalW=Math.min(1000,Math.max(320,document.querySelector('.card').clientWidth-6));
  const dotArea=totalW-cL-cR;
  const cnt=items.length;
  const dotR=mob?10:13;
  const maxH=Math.max(mob?38:48,...items.map(it=>mH(it.n,labelW-8,FS)+12));
  const rowH=items.map(()=>maxH);
  const cumY=[0];rowH.forEach((h,i)=>cumY.push(cumY[i]+h));
  const topP=mob?40:48;
  const totalH=topP+cumY[cnt]+4;
  svg.attr('width',totalW).attr('height',totalH).attr('viewBox',`0 0 ${totalW} ${totalH}`);
  const x=d3.scaleLinear().domain([0.5,34.5]).range([0,dotArea]);

  // "Hạng" label
  svg.append('text').attr('x',cL+dotArea/2).attr('y',mob?13:16)
    .attr('text-anchor','middle').attr('fill','var(--tx2)')
    .attr('font-size',AXIS_FS).attr('font-weight','700').text('Hạng');

  // Grid with #
  (mob?[1,10,20,34]:[1,5,10,15,20,25,30,34]).forEach(t=>{
    const tx=cL+x(t);
    svg.append('line').attr('x1',tx).attr('y1',topP).attr('x2',tx).attr('y2',topP+cumY[cnt])
      .attr('stroke','var(--bd)').attr('stroke-width',.5);
    svg.append('text').attr('x',tx).attr('y',topP-6).attr('text-anchor','middle')
      .attr('fill','var(--tx3)').attr('font-size',mob?'11':'14').text('#'+t);
  });

  items.forEach((it,i)=>{
    const yT=topP+cumY[i],rh=rowH[i],yM=yT+rh/2;
    const col=rCol(it.r),dx=cL+x(it.r),cc=!!clickFn;
    if(i%2===0)svg.append('rect').attr('x',0).attr('y',yT).attr('width',totalW).attr('height',rh).attr('fill','var(--sf2)').attr('opacity',.55);

    // Label — RIGHT aligned, with gap before axis
    const fo=svg.append('foreignObject').attr('x',4).attr('y',yT+1).attr('width',labelW-4).attr('height',rh-2);
    fo.append('xhtml:div')
      .style('font-family','Arial, Helvetica, sans-serif')
      .style('font-size',FS+'px').style('font-weight','500').style('color','var(--tx)')
      .style('line-height','1.3').style('display','flex').style('align-items','center')
      .style('height','100%').style('word-break','break-word').style('white-space','pre-line')
      .style('cursor',cc?'pointer':'default')
      .style('justify-content','flex-end')
      .style('text-align','right')
      .style('padding','0 0 0 4px')
      .text(it.n)
      .on('click',()=>{if(cc)clickFn(it,i);});

    // Line
    svg.append('line').attr('x1',cL).attr('y1',yM).attr('x2',cL).attr('y2',yM)
      .attr('stroke',col).attr('stroke-width',2).attr('stroke-opacity',.2).attr('stroke-linecap','round')
      .transition().duration(320).delay(i*16).attr('x2',dx);
    // Dot
    svg.append('circle').attr('cx',cL).attr('cy',yM).attr('r',dotR)
      .attr('fill',col).attr('opacity',0).attr('cursor',cc?'pointer':'default')
      .transition().duration(320).delay(i*16).attr('cx',dx).attr('opacity',.9);
    // Rank in dot
    svg.append('text').attr('x',cL).attr('y',yM+1)
      .attr('text-anchor','middle').attr('dominant-baseline','middle')
      .attr('fill','#fff').attr('font-size',mob?'11':'14').attr('font-weight','700')
      .attr('pointer-events','none').attr('opacity',0).text(it.r)
      .transition().duration(320).delay(i*16).attr('x',dx).attr('opacity',1);

    // Hover+click
    svg.append('rect').attr('x',0).attr('y',yT).attr('width',totalW).attr('height',rh)
      .attr('fill','transparent').attr('cursor',cc?'pointer':'default')
      .on('mousemove touchstart',(e)=>{
        const ev=e.touches?e.touches[0]:e;
        tt.innerHTML=`<div class="tn">${it.n}</div>
          ${gl?`<div class="tr"><span class="tl">Nhóm</span><span class="tv">${gl}</span></div>`:''}
          <div class="tr"><span class="tl">Điểm số</span><span class="tv">${fmt(it.s)}</span></div>
          <div class="tr"><span class="tl">Thứ hạng</span><span class="tv" style="color:${col}">#${it.r}/34</span></div>`;
        tt.classList.add('show');
        let tx2=ev.clientX+10,ty2=ev.clientY-10;
        if(tx2+280>window.innerWidth)tx2=ev.clientX-280;
        if(ty2+80>window.innerHeight)ty2=ev.clientY-80;
        if(tx2<2)tx2=2;
        tt.style.left=tx2+'px';tt.style.top=ty2+'px';
      },{passive:true})
      .on('mouseleave touchend',()=>tt.classList.remove('show'))
      .on('click',()=>{if(cc)clickFn(it,i);});
  });
}
function showP(rs){
  if(rs!==false)ns=[];setBC([]);
  gd.textContent='Chọn chấm tròn để xem thêm';
  draw(P.map(p=>({...p})),null,(it)=>{
    const pi=P.findIndex(p=>p.id===it.id);ns.push(()=>showP(false));showS(pi);},false);
}
function showS(pi){
  const p=P[pi];setBC([{t:p.n}]);
  gd.textContent='Chọn chấm tròn để xem thêm';
  draw(p.subs.map(s=>({...s})),p.n,(it)=>{
    const si=p.subs.findIndex(s=>s.id===it.id);ns.push(()=>showS(pi));showI(pi,si);},true);
}
function showI(pi,si){
  const p=P[pi],sub=p.subs[si];
  setBC([{t:p.n,fn:()=>{ns=[()=>showP(false)];showS(pi);}},{t:sub.n}]);
  gd.textContent='Chọn chấm tròn để xem thêm';
  draw(sub.inds.map(d=>({...d})),sub.n,null,true);
}
showP();
window.addEventListener('resize',()=>{if(ns.length===0)showP(false);});
</script>
</body>
</html>
